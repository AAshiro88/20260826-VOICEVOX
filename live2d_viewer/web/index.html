<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live2D 檢視器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="topbar">
    <label id="model-label" for="model-select">模型</label>
    <select id="model-select" disabled></select>
    <span id="conn-status" class="off">連線中…</span>
  </div>
  <canvas id="canvas"></canvas>
  <div id="hint">拖曳畫面可讓角色視線跟隨；連上聊天程式後即可受 AI 的 3D 指令控制。</div>
  <div id="overlay" class="hidden"></div>
  <div id="testpanel">
    <button id="testpanel-toggle" type="button">動作測試</button>
    <div id="testpanel-body">
      <div id="tp-msg"></div>
    </div>
  </div>
  <script src="sdk/core/live2dcubismcore.min.js"></script>
  <script src="viewer.bundle.js"></script>
</body>
</html>
